# Netlify: статический лендинг без сборки.
# originals/, async-trajectory-batch-saving/, макеты и QA-файлы не публикуются —
# в dist/ копируется только то, что нужно сайту (см. AGENTS.md).
[build]
  command = "rm -rf dist && mkdir dist && cp -r index.html styles.css app.js links.js hero-scene.js assets dist/"
  publish = "dist"

# Хэшируемые статические ресурсы — долгий кэш; HTML/JS конфига — без изменений.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
